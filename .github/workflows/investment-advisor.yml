name: Investment Advisor

on:
  # SCHEDULE DISABLED 2026-08-09. The advisor pipeline now runs inside the investiments
  # service itself (its own scheduler ticks every 5 min against a UTC-day state file on
  # the Railway volume), so this cron would produce a SECOND report for the same date and
  # POST it over the one the service just generated — last writer wins, and the two
  # disagree because they are separate model runs. It has already happened once: on
  # 2026-08-09 this workflow could not reach /api/snapshot mid-deploy and overwrote the
  # day with {"summary": "Run aborted: portfolio snapshot unavailable."}.
  #
  # workflow_dispatch is deliberately KEPT: the scripts still work and are a usable manual
  # fallback if the in-service pipeline is ever down. Restore the cron only if the
  # investiments-side scheduler is retired.
  #   schedule:
  #     - cron: "0 13 * * *"   # daily 13:00 UTC
  workflow_dispatch:

jobs:
  advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Prefetch + run advisor (claude-fable-5, Virtuals fallback)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VIRTUALS_API_KEY: ${{ secrets.VIRTUALS_API_KEY }}
          USEPOD_TOKEN: ${{ secrets.USEPOD_TOKEN }}
          USEPOD_MODEL: ${{ vars.USEPOD_MODEL }}
          ADVISOR_LLM: ${{ vars.ADVISOR_LLM }}
          # PM review committee (Option C) — off by default; no new secret required.
          ADVISOR_PM_COMMITTEE: ${{ vars.ADVISOR_PM_COMMITTEE }}
          ADVISOR_COMMITTEE_QUORUM: ${{ vars.ADVISOR_COMMITTEE_QUORUM }}
          USEPOD_COMMITTEE_MODELS: ${{ vars.USEPOD_COMMITTEE_MODELS || 'deepseek-v3.2,qwen-3.5,llama-4' }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x scripts/advisor/prefetch-data.sh scripts/advisor/run.sh scripts/advisor/grade-recs.sh scripts/advisor/notify-vesting.sh scripts/advisor/notify-drawdown.sh scripts/advisor/notify-yield-delta.sh scripts/llm.sh scripts/llm-claude.sh scripts/llm-usepod.sh
          ./scripts/advisor/prefetch-data.sh
          ./scripts/advisor/grade-recs.sh || echo "::warning::grade-recs failed"
          ./scripts/advisor/run.sh
          ./scripts/advisor/notify-vesting.sh || echo "::warning::notify-vesting failed"
          ./scripts/advisor/notify-drawdown.sh || echo "::warning::notify-drawdown failed"
          ./scripts/advisor/notify-yield-delta.sh || echo "::warning::notify-yield-delta failed"
