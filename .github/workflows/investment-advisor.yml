name: Investment Advisor

on:
  schedule:
    - cron: "0 13 * * *"   # daily 13:00 UTC
  workflow_dispatch:

jobs:
  advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Prefetch + run advisor (claude-fable-5, Virtuals fallback)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VIRTUALS_API_KEY: ${{ secrets.VIRTUALS_API_KEY }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x scripts/advisor/prefetch-data.sh scripts/advisor/run.sh scripts/advisor/notify-vesting.sh scripts/advisor/notify-drawdown.sh scripts/advisor/notify-yield-delta.sh scripts/llm.sh scripts/llm-claude.sh
          ./scripts/advisor/prefetch-data.sh
          ./scripts/advisor/run.sh
          ./scripts/advisor/notify-vesting.sh || echo "::warning::notify-vesting failed"
          ./scripts/advisor/notify-drawdown.sh || echo "::warning::notify-drawdown failed"
          ./scripts/advisor/notify-yield-delta.sh || echo "::warning::notify-yield-delta failed"
